name: Wave task
description: For maintainers. File a scoped, priced task for Wave contributors.
title: "[wave]: "
labels: ["wave"]
body:
  - type: markdown
    attributes:
      value: |
        A Wave task must be finishable without guessing. Name the files, state what done means, and say how it will be checked. Contributors comment to be assigned and start only after assignment; unassigned pull requests are not reviewed.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@tollway/core"
        - "@tollway/client"
        - "@tollway/server"
        - "@tollway/adapter-express"
        - "@tollway/adapter-fastify"
        - "@tollway/adapter-next"
        - "@tollway/adapter-hono"
        - "@tollway/channels"
        - "@tollway/reconcile"
        - "@tollway/observability"
        - "@tollway/theme"
        - apps/dashboard
        - apps/web
        - apps/demo
        - examples
        - Repository tooling
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be built or fixed, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and motivation
      description: Why this matters and what exists today. Link the code, the design.md section, and related issues.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that defines done. Each item must be checkable by a reviewer.
      placeholder: |
        - [ ] ...
        - [ ] A test covers the failure path
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Implementation notes
      description: Files to read first, upstream APIs to use (with versions), and what is out of scope.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing and PR requirements
      value: |
        - `./scripts/preflight.sh` must pass.
        - Add a release note in `docs/release-notes/` if package or app source changes, and a changeset if a publishable package changes.
        - The PR body includes `Closes #<this issue>`.
        - Follow AGENTS.md and CONTRIBUTING.md.
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      description: Sets the Wave points. Apply the matching complexity label as well.
      options:
        - Trivial (100 points)
        - Medium (150 points)
        - High (200 points)
    validations:
      required: true
