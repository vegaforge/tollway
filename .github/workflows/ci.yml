name: CI

# Gate jobs run in parallel. The quality job aggregates them, and it is the
# only check branch protection needs to require, so jobs can be added or
# renamed here without touching the protection settings.
#
# Actions are pinned to a full commit SHA with the release tag in a comment.
# Dependabot (github-actions ecosystem) updates both together.

on:
  push:
    branches: [dev, staging, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository.
permissions:
  contents: read

env:
  CI: true

jobs:
  # Code moves one way: feature branch into dev, dev into staging, staging
  # into main. See docs/adr/ADR-2026-11-18-branch-flow.md. This job is part of
  # quality, so the flow is enforced by the check that is already required.
  branch-flow:
    name: branch flow
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: dev to staging to main
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request, nothing to check."
            exit 0
          fi
          if [ "$BASE" = "staging" ] || [ "$BASE" = "main" ]; then
            if [ "$HEAD_REPO" != "$REPO" ]; then
              echo "Pull requests into $BASE must come from this repository, not a fork. Open yours against dev."
              exit 1
            fi
          fi
          case "$BASE" in
            main)
              [ "$HEAD" = "staging" ] || { echo "main only accepts pull requests from staging, not $HEAD. Open yours against dev."; exit 1; } ;;
            staging)
              [ "$HEAD" = "dev" ] || { echo "staging only accepts pull requests from dev, not $HEAD. Open yours against dev."; exit 1; } ;;
            dev)
              if [ "$HEAD" = "staging" ] || [ "$HEAD" = "main" ]; then
                echo "dev does not take pull requests from $HEAD. Changes flow dev to staging to main."
                exit 1
              fi ;;
            *)
              echo "Pull requests go into dev. $BASE is not one of dev, staging or main."
              exit 1 ;;
          esac
          echo "$HEAD into $BASE follows the branch flow."

  checks:
    name: format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # The usual cause is a branch cut from an old dev, or a package.json edit
      # without a lockfile update. pnpm's own message does not say what to do.
      - name: Explain an out-of-date lockfile
        if: failure() && steps.install.outcome == 'failure'
        run: |
          echo "::error title=Lockfile out of date::pnpm-lock.yaml does not match the package.json files. Merge the latest dev into your branch, run pnpm install, and commit the updated pnpm-lock.yaml. Keep the dependency versions dev already has; do not roll them back."
          exit 1

      - name: Format check
        run: pnpm format:check

      - name: Lint (warnings fail)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unused or undeclared dependencies (Knip)
        run: pnpm knip

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The whole suite takes seconds, so it is not sharded. Sharding through
      # turbo would split each package's vitest run, not the suite.
      - name: Test
        run: pnpm test

      # docs/design.md "Testing": the end-to-end demo runs in CI on every
      # commit. x402 and MPP charge for now; MPP channel joins once the gate
      # accepts vouchers (#173). (#242)
      - name: Build demo dependencies
        run: pnpm --filter "@vegaforge/tollway-demo^..." build

      - name: Demo all-models (mock mode)
        run: MOCK_MODE=true pnpm --filter @vegaforge/tollway-demo start -- all-models

  adapter-next-matrix:
    name: Next adapter (Next ${{ matrix.major }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 14
            range: ^14.0.0
          - major: 15
            range: ^15.0.0
          - major: 16
            range: ^16.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The adapter's tests import the workspace packages it depends on from
      # their built output, so build those first.
      - name: Build the adapter's workspace dependencies
        run: pnpm --filter "@vegaforge/tollway-adapter-next^..." build

      - name: Select Next major
        env:
          NEXT_RANGE: ${{ matrix.range }}
        run: pnpm --filter @vegaforge/tollway-adapter-next add --save-dev "next@$NEXT_RANGE"

      - name: Test adapter on selected Next major
        run: pnpm --filter @vegaforge/tollway-adapter-next test

  build:
    name: build, release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release-note gate diffs the branch against the pull request's
          # base branch (origin/main on pushes).
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: API Extractor reports (#254)
        run: bash scripts/check-api-reports.sh

      - name: Package exports, publint and arethetypeswrong (#254)
        run: bash scripts/check-package-exports.sh

      - name: Package consumers, ESM and CommonJS under node16 (#254)
        run: bash scripts/check-package-consumers.sh

      - name: Release-note gate
        run: bash scripts/check_release_notes.sh
        env:
          STRICT_RELEASE_NOTES: "true"
          RELEASE_NOTES_BASE: origin/${{ github.base_ref || 'main' }}

  e2e:
    name: dashboard e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The dashboard and the workspace packages it builds from.
          if git diff --quiet "$BASE" HEAD -- apps/dashboard packages/core packages/channels \
              packages/observability packages/theme pnpm-lock.yaml .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.paths.outputs.changed == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.paths.outputs.changed == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.paths.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.paths.outputs.changed == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/dashboard/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        if: steps.paths.outputs.changed == 'true'
        run: pnpm --filter @vegaforge/tollway-dashboard exec playwright install --with-deps chromium

      # The dashboard imports these packages from their built output.
      - name: Build the dashboard's workspace dependencies
        if: steps.paths.outputs.changed == 'true'
        run: pnpm --filter "@vegaforge/tollway-dashboard^..." build

      - name: Test dashboard in the browser
        if: steps.paths.outputs.changed == 'true'
        run: pnpm --filter @vegaforge/tollway-dashboard test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.paths.outputs.changed == 'true'
        with:
          name: playwright-report
          path: |
            apps/dashboard/playwright-report
            apps/dashboard/test-results
          retention-days: 7

      - name: Report
        if: steps.paths.outputs.changed == 'false'
        run: echo "No dashboard, dependency, lockfile, or workflow changes; browser suite not needed."

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [branch-flow, checks, tests, adapter-next-matrix, build, e2e]
    if: always()
    steps:
      # Anything other than success fails this job, including a cancelled or
      # skipped gate, so a gate that did not run can never count as a pass.
      - name: Every gate passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "At least one gate did not succeed:"
          echo "  branch flow: ${{ needs.branch-flow.result }}"
          echo "  checks: ${{ needs.checks.result }}"
          echo "  tests:  ${{ needs.tests.result }}"
          echo "  Next adapter matrix: ${{ needs.adapter-next-matrix.result }}"
          echo "  build:  ${{ needs.build.result }}"
          echo "  e2e:    ${{ needs.e2e.result }}"
          exit 1

      - name: Report
        run: echo "branch flow, checks, tests, Next adapter matrix, build and dashboard e2e all succeeded."
