name: CI

# Three gate jobs run in parallel. The quality job aggregates them, and it is
# the only check branch protection needs to require, so jobs can be added or
# renamed here without touching the protection settings.
#
# Actions are pinned to a full commit SHA with the release tag in a comment.
# Dependabot (github-actions ecosystem) updates both together.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository.
permissions:
  contents: read

env:
  CI: true

jobs:
  checks:
    name: format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint (warnings fail)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The whole suite takes seconds, so it is not sharded. Sharding through
      # turbo would split each package's vitest run, not the suite.
      - name: Test
        run: pnpm test

  build:
    name: build, release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release-note gate diffs the branch against origin/main.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Release-note gate
        run: bash scripts/check_release_notes.sh
        env:
          STRICT_RELEASE_NOTES: "true"

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, tests, build]
    if: always()
    steps:
      # Anything other than success fails this job, including a cancelled or
      # skipped gate, so a gate that did not run can never count as a pass.
      - name: Every gate passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "At least one gate did not succeed:"
          echo "  checks: ${{ needs.checks.result }}"
          echo "  tests:  ${{ needs.tests.result }}"
          echo "  build:  ${{ needs.build.result }}"
          exit 1

      - name: Report
        run: echo "checks, tests and build all succeeded."
