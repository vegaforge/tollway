name: Release

# Nothing here runs on its own. Until releases start after the Drips Wave, a
# maintainer triggers this workflow by hand:
#
# - on dev with "version" set, to open the Changesets "Version Packages" pull
#   request into dev, so version bumps travel dev to staging to main like
#   every other change (docs/adr/ADR-2026-11-18-branch-flow.md);
# - on main with "publish" set, to publish to npm.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Open or update the Version Packages pull request (run on dev)
        type: boolean
        default: false
      publish:
        description: Publish pending releases to npm
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version packages
    if: inputs.version && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Changesets pushes the version branch
      pull-requests: write # and opens or updates the version pull request
    steps:
      # Changesets pushes the version branch with the checkout's credentials,
      # so they have to persist here. This job uploads no artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create or update the version pull request
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for npm provenance: the publish job signs its own OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Versions are bumped on dev. If changesets are still pending here, the
      # version pull request was not merged before promotion, and publishing
      # would ship packages whose version and changelog do not match.
      - name: No pending changesets
        run: |
          pending=$(find .changeset -name '*.md' ! -name 'README.md' | sort)
          if [ -n "$pending" ]; then
            echo "Unreleased changesets are still on main:"
            echo "$pending"
            echo "Merge the Version Packages pull request into dev and promote it first."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish
        run: pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Publish with npm provenance so each package is signed and
          # verifiable at https://www.npmjs.com/package/<name>/v/<version>.
          # Requires id-token: write (above) and GitHub Actions OIDC.
          # Verify with: npm audit signatures @vegaforge/tollway-core
          NPM_CONFIG_PROVENANCE: "true"
