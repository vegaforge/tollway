# Netlify build for the Tollway dashboard (apps/dashboard).
#
# In the Netlify UI, set the package directory to apps/dashboard and leave the
# base directory empty. Netlify then installs from the repository root, where
# pnpm-lock.yaml, .nvmrc and the packageManager field live, and reads this file.
# Paths below are relative to the repository root.
#
# Netlify adds its Next.js runtime on its own; nothing else needs installing.
# The dashboard still reads its typed local stubs (src/data); wiring it to a
# real service is #237, so this file adds no data configuration.

[build]
  command = "pnpm turbo build --filter=@vegaforge/tollway-dashboard"
  publish = "apps/dashboard/.next"

  # Skip the build when nothing the dashboard uses has changed. Exit code 0
  # means skip. The dashboard depends on its own folder, the channels, core
  # and theme packages, and the lockfile.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/dashboard packages/channels packages/core packages/theme pnpm-lock.yaml pnpm-workspace.yaml package.json"
